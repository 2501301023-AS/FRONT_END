<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="#">ShopEasy</a>
    <button class="navbar-toggler bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>


<section class="contact-section">
  <div class="container">
    <div class="row">

         <div class="col-md-7">
        <div class="contact-box">
 <h3>Contact Us</h3>

   <form>
            <div class="mb-3">
              <label>Name</label>
              <input type="text" class="form-control" placeholder="Enter your name">
            </div>
              <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label>Subject</label>
              <input type="text" class="form-control" placeholder="Enter subject">
            </div>

            <div class="mb-3">
              <label>Message</label>
              <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Send Message</button>

   </form>

        </div></div>


    </div></div></section>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
